# AcmeOS 4.2 running-config  --  a vendor this tool has NEVER seen
system identity hostname FW-EDGE-01
!
service telnet state enabled port 23
service ssh state enabled protocol-version 2
service web-ui state enabled port 80
!
admin-auth privileged-secret hash sha512 $6$Xa9Kd$8fH2...
password-storage encryption on
auth-profile aaa mode radius
!
snmp-agent community name "public" access read-only
snmp-agent community name "netops" access read-write
!
log-target host 10.20.0.9 severity informational
time-source ntp state none
!
mgmt-line idle-timeout 0
mgmt-line access-filter none
discovery-protocol lldp state enabled
login-banner text ""
!
zone-policy trust-to-untrust default-action deny
