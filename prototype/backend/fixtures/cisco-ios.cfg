! Cisco IOS running-config  --  partially hardened, several real gaps
!
version 15.2
service password-encryption
hostname RTR-EDGE-01
!
enable secret 5 $1$mERr$7GhOa1Q9k2Zc0Xb8vN2u0
!
aaa new-model
!
ip http server
ip ssh version 2
!
snmp-server community public RO
snmp-server community netops RW
!
logging host 10.1.1.5
ntp server 10.1.1.9
!
banner login ^C Authorized access only. ^C
!
interface GigabitEthernet0/0
 ip address 203.0.113.2 255.255.255.0
 no shutdown
!
line con 0
 exec-timeout 5 0
line vty 0 4
 exec-timeout 0 0
 transport input telnet ssh
 login local
!
end
