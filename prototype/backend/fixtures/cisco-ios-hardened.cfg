! Cisco IOS running-config  --  hardened (all fixes applied)
!
version 15.2
service password-encryption
hostname RTR-EDGE-01
!
enable secret 5 $1$mERr$7GhOa1Q9k2Zc0Xb8vN2u0
!
aaa new-model
!
no ip http server
ip ssh version 2
!
snmp-server community s3cr3t-ro RO 10
